<svg width="460" height="330" viewBox="0 0 460 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animado: agente de IA da DFsystem qualificando um lead automaticamente" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="l1"><rect x="30" y="66" width="0" height="36">
      <animate attributeName="width" values="0;0;300;300" keyTimes="0;0.02;0.11;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l2"><rect x="30" y="100" width="0" height="36">
      <animate attributeName="width" values="0;0;345;345" keyTimes="0;0.16;0.27;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l3"><rect x="30" y="134" width="0" height="36">
      <animate attributeName="width" values="0;0;270;270" keyTimes="0;0.32;0.40;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l4"><rect x="30" y="168" width="0" height="36">
      <animate attributeName="width" values="0;0;250;250" keyTimes="0;0.45;0.56;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l5"><rect x="30" y="202" width="0" height="36">
      <animate attributeName="width" values="0;0;330;330" keyTimes="0;0.61;0.70;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l6"><rect x="30" y="236" width="0" height="36">
      <animate attributeName="width" values="0;0;345;345" keyTimes="0;0.75;0.86;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 19px; }
    .dim  { fill: #8B949E; }
    .txt  { fill: #C9D1D9; }
    .ok   { fill: #3FB950; }
    .acc  { fill: #EA4B71; }
    .hot  { fill: #3FB950; font-weight: 700; }
  </style>

  <rect x="0" y="0" width="460" height="330" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="1" y="1" width="458" height="44" rx="11" fill="#161B22"/>
  <circle cx="26" cy="23" r="6.5" fill="#FF5F56"/>
  <circle cx="48" cy="23" r="6.5" fill="#FFBD2E"/>
  <circle cx="70" cy="23" r="6.5" fill="#27C93F"/>
  <text x="240" y="29" class="mono dim" text-anchor="middle" font-size="15">agente comercial</text>

  <g clip-path="url(#l1)">
    <text x="34" y="92" class="mono"><tspan class="acc">→</tspan><tspan class="txt" dx="10">novo lead recebido</tspan></text>
  </g>
  <g clip-path="url(#l2)">
    <text x="34" y="126" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="10">prospecção e alinhamento</tspan></text>
  </g>
  <g clip-path="url(#l3)">
    <text x="34" y="160" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="10">catálogo analisado</tspan></text>
  </g>
  <g clip-path="url(#l4)">
    <text x="34" y="194" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="10">proposta enviada</tspan></text>
  </g>
  <g clip-path="url(#l5)">
    <text x="34" y="228" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="10">agendamento marcado</tspan></text>
  </g>
  <g clip-path="url(#l6)">
    <text x="34" y="262" class="mono"><tspan class="hot">★</tspan><tspan class="hot" dx="10">lead qualificado na fila</tspan></text>
  </g>

  <text x="34" y="300" class="mono"><tspan class="ok">$</tspan></text>
  <rect x="52" y="286" width="10" height="18" fill="#EA4B71">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
