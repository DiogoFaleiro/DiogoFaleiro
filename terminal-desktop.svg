  <rect x="0" y="0" width="840" height="320" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="1" y="1" width="838" height="46" rx="11" fill="#161B22"/>
  <circle cx="28" cy="24" r="7" fill="#FF5F56"/>
  <circle cx="52" cy="24" r="7" fill="#FFBD2E"/>
  <circle cx="76" cy="24" r="7" fill="#27C93F"/>
  <text x="420" y="31" class="mono dim" text-anchor="middle" font-size="16">dfsystem — agente comercial</text>

  <g clip-path="url(#d1)">
    <text x="38" y="92" class="mono"><tspan class="acc">→</tspan><tspan class="txt" dx="10">novo lead recebido no WhatsApp</tspan></text>
  </g>
