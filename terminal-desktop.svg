<svg width="840" height="320" viewBox="0 0 840 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animado: agente de IA da DFsystem qualificando um lead automaticamente" xmlns:c2pa="http://c2pa.org/manifest">
