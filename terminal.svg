<svg width="820" height="250" viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animado: agente de IA da DFsystem processando um atendimento automaticamente" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="c1"><rect x="36" y="60" width="0" height="34">
      <animate attributeName="width" values="0;0;200;200" keyTimes="0;0.03;0.14;1" dur="11s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="36" y="96" width="0" height="34">
      <animate attributeName="width" values="0;0;350;350" keyTimes="0;0.21;0.34;1" dur="11s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="36" y="128" width="0" height="34">
      <animate attributeName="width" values="0;0;290;290" keyTimes="0;0.40;0.52;1" dur="11s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="36" y="160" width="0" height="34">
      <animate attributeName="width" values="0;0;420;420" keyTimes="0;0.58;0.74;1" dur="11s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .dim  { fill: #8B949E; }
    .txt  { fill: #C9D1D9; }
    .ok   { fill: #3FB950; }
    .acc  { fill: #EA4B71; }
    .cur  { fill: #EA4B71; }
  </style>

  <rect x="0" y="0" width="820" height="250" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <rect x="1" y="1" width="818" height="40" rx="11" fill="#161B22"/>
  <circle cx="24" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="21" r="6" fill="#27C93F"/>
  <text x="410" y="26" class="mono dim" text-anchor="middle" font-size="13">dfsystem — agente de atendimento</text>

  <g clip-path="url(#c1)">
    <text x="40" y="84" class="mono"><tspan class="ok">$</tspan><tspan class="txt" dx="8">agente.iniciar()</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text x="40" y="118" class="mono"><tspan class="acc">→</tspan><tspan class="txt" dx="8">novo pedido recebido no WhatsApp</tspan></text>
  </g>
  <g clip-path="url(#c3)">
    <text x="40" y="150" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="8">cliente localizado no ERP</tspan></text>
  </g>
  <g clip-path="url(#c4)">
    <text x="40" y="182" class="mono"><tspan class="ok">✓</tspan><tspan class="txt" dx="8">orçamento enviado · follow-up agendado</tspan></text>
  </g>

  <text x="40" y="216" class="mono"><tspan class="ok">$</tspan></text>
  <rect x="58" y="204" width="9" height="16" class="cur">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
